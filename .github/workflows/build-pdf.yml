name: Build & Release Resume PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'generate_master_resume.py'
      - 'Nasir_Hayat_Master_Resume.html'
      - 'Nasir_Hayat_Master_Resume.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libxkbcommon-x11-0 libfontconfig1

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          pip install PySide6

      - name: Compile Master Resume to PDF
        run: |
          export QT_QPA_PLATFORM=offscreen
          python3 generate_master_resume.py

      - name: Validate Generated PDF
        run: |
          if [ ! -f "Nasir_Hayat_Master_Resume.pdf" ]; then
            echo "Error: Nasir_Hayat_Master_Resume.pdf was not generated!"
            exit 1
          fi
          echo "Success: Nasir_Hayat_Master_Resume.pdf generated ($(stat -c%s Nasir_Hayat_Master_Resume.pdf) bytes)"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nasir_Hayat_Master_Resume
          path: Nasir_Hayat_Master_Resume.pdf
          retention-days: 90

      - name: Publish / Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Latest Master Resume Deliverable"
          body: |
            ## Nasir Hayat — DevOps & DevSecOps Master Resume
            
            Automated CI/CD build artifact compiled from `generate_master_resume.py`.
            
            - **Deliverable:** `Nasir_Hayat_Master_Resume.pdf` (Strict 2-page ATS-optimized format)
            - **Contact:** nasirhayat.dev@gmail.com | [LinkedIn](https://www.linkedin.com/in/nasir-hayat-4515202a2) | [GitHub](https://github.com/nasirhayat028)
          files: Nasir_Hayat_Master_Resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
